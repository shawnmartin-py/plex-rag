[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "plex-project"
version = "0.1.0"
description = "AI-powered movie recommendations from your Plex library via RAG"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "duckdb>=1.5.4",
    "httpx>=0.28.1",
    "langchain>=1.3.9",
    "langchain-google-genai>=4.2.3",
    "langchain-qdrant>=1.1.0",
    "nicegui>=3.14.0",
    "numpy>=2.4.6",
    "pillow>=12.3.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.13.1",
    "qdrant-client>=1.18.0",
    "tenacity>=9.1.4",
    "typer>=0.15.0",
]

[project.scripts]
plex-rag = "app.cli:app"
plex-rag-web = "nicegui_app.main:main"

[tool.setuptools.packages.find]
include = ["app*", "nicegui_app*"]

[dependency-groups]
dev = [
    "hypothesis>=6.140.4",
    "mypy>=1.19.0",
    "playwright>=1.60.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-mock>=3.15.1",
]
eval = [
    "langchain-community<0.4",
    "ragas>=0.4.3,<0.5",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I", "S", "B", "UP", "PERF"]

[tool.ruff.lint.per-file-ignores]
# S101: assert is the normal pytest idiom. S311: seeded random.Random(n) in tests is
# for determinism, not cryptography.
"tests/**" = ["S101", "S311"]

[tool.mypy]
strict = true
ignore_missing_imports = true
explicit_package_bases = true
exclude = [".venv", "venv", "build"]
