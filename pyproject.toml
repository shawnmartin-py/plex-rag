[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "plex-project"
version = "0.1.0"
description = "AI-powered movie recommendations from your Plex library via RAG"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "duckdb>=1.5.4",
    "langchain>=1.3.2",
    "langchain-google-genai>=4.2.3",
    "langchain-qdrant>=1.1.0",
    "nicegui>=3.14.0",
    "pydantic>=2.13.4",
    "qdrant-client>=1.18.0",
    "typer>=0.15.0",
]

[project.scripts]
plex-rag = "app.cli:app"
plex-rag-web = "nicegui_app.main:main"

[tool.setuptools.packages.find]
include = ["app*", "nicegui_app*"]

[dependency-groups]
dev = [
    "mypy>=1.19.0",
    "playwright>=1.60.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-mock>=3.15.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I", "S", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
strict = true
ignore_missing_imports = true
explicit_package_bases = true
exclude = [".venv", "venv", "build"]
