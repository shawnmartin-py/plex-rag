---
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-json
      - id: check-yaml
      - id: check-merge-conflict
      - id: check-added-large-files
        exclude: ^docs/images/
      - id: check-added-large-files
        name: check-added-large-files (screenshots)
        args: [--maxkb=1000]
        files: ^docs/images/

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.21
    hooks:
      - id: ruff
        language_version: python3.14
        args: [--fix]
      - id: ruff-format
        language_version: python3.14

  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: bash -c 'uv pip install --quiet --python "$(command -v python)" . --group dev && exec mypy "$@"' --
        language: python
        language_version: python3.14
        pass_filenames: false
        args: [.]
        types: [python]
        additional_dependencies:
          - mypy>=1.19.0

  - repo: https://github.com/jumanjihouse/pre-commit-hook-yamlfmt
    rev: 0.2.3
    hooks:
      - id: yamlfmt
        args: [--mapping, '2', --sequence, '4', --offset, '2', --preserve-quotes]
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        # detect-secrets walks the filesystem directly (not git-tracked files
        # only), so untracked/gitignored cache dirs must be excluded here
        # explicitly or the baseline balloons with e.g. .mypy_cache noise.
        args: ['--baseline', '.secrets.baseline', '--exclude-files', '\.venv/|venv/|\.mypy_cache/|\.ruff_cache/']
        exclude: (^|.+/)tests/
